<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Workout Tracker</title>
    
    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout Tracker">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2a3a54;
            --input-bg: #0b0f19;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; max-width: 1200px; margin: 0 auto; padding-bottom: 60px; }
        header { text-align: center; margin-bottom: 20px; padding: 15px; background: linear-gradient(135deg, #151f32, #0b0f19); border-radius: 12px; border: 1px solid var(--border-color); }
        h1 { color: var(--accent-blue); font-size: 1.6rem; margin-bottom: 6px; }
        p.subtitle { color: var(--text-muted); font-size: 0.85rem; }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 15px; background: var(--card-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; }
        .period-selector { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .period-selector label { font-weight: bold; color: var(--accent-blue); font-size: 0.9rem; }
        select, input[type="text"], input[type="date"], textarea { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
        
        .main-views { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .view-btn { flex: 1; background: #1e293b; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.9rem; text-align: center; }
        .view-btn.active { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }

        .days-container { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
        .tab-btn.active { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }

        .table-container { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        table.workout-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        table.workout-table th, table.workout-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        table.workout-table th { background-color: #0b0f19; color: var(--accent-blue); font-size: 0.8rem; text-transform: uppercase; }
        table.workout-table td input { width: 100%; }

        .btn { background-color: var(--accent-blue); color: #0f172a; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; }
        .btn-green { background-color: var(--accent-green); color: #ffffff; }
        .btn-red { background-color: var(--accent-red); color: #ffffff; padding: 5px 8px; font-size: 0.75rem; }
        .btn-purple { background-color: var(--accent-purple); color: #ffffff; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
        .log-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-bottom: 12px; }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .log-title { font-weight: bold; color: var(--accent-blue); font-size: 1rem; }
        .log-date { color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>🏋️ Workout Tracker</h1>
        <p class="subtitle">Schede, Storico & Grafici di Progresso</p>
    </header>

    <div class="main-views">
        <button id="viewSchedaBtn" class="view-btn active">📋 Scheda</button>
        <button id="viewStoricoBtn" class="view-btn">📖 Storico</button>
        <button id="viewGraficiBtn" class="view-btn">📈 Grafici</button>
    </div>

    <!-- SCHEDA -->
    <div id="sectionScheda">
        <div class="toolbar">
            <div class="period-selector">
                <label for="periodSelect">📅 PERIODO:</label>
                <select id="periodSelect"></select>
                <button id="addPeriodBtn" class="btn btn-purple">➕ Nuovo</button>
                <button id="delPeriodBtn" class="btn btn-red">🗑️ Elimina</button>
            </div>
            <button id="resetDataBtn" class="btn btn-outline" style="font-size: 0.75rem;">🔄 Reset</button>
        </div>
        <div class="days-container" id="daysTabsContainer"></div>
        <div id="dayContentArea"></div>
    </div>

    <!-- STORICO -->
    <div id="sectionStorico" style="display: none;">
        <div class="action-bar">
            <h2>📖 Registro Sessioni</h2>
            <button id="newLogBtn" class="btn btn-green">📝 Registra Workout</button>
        </div>

        <div id="logFormCard" class="log-card" style="display: none; border-color: var(--accent-green);">
            <h3 style="margin-bottom: 10px; color: var(--accent-green);">Registra Sessione</h3>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
                <input type="date" id="logDate">
                <select id="logPeriodSelect"></select>
                <select id="logDaySelect"></select>
            </div>
            <div id="logExercisesContainer" style="margin-bottom: 10px;"></div>
            <textarea id="logNotes" style="width: 100%; height: 50px; margin-bottom: 10px;" placeholder="Note sessione..."></textarea>
            <div style="display: flex; gap: 8px;">
                <button id="saveLogBtn" class="btn btn-green">💾 Salva</button>
                <button id="cancelLogBtn" class="btn btn-outline">Annulla</button>
            </div>
        </div>
        <div id="historyList"></div>
    </div>

    <!-- GRAFICI -->
    <div id="sectionGrafici" style="display: none;">
        <div class="action-bar">
            <h2>📈 Progressioni</h2>
        </div>
        <div class="toolbar">
            <div class="period-selector">
                <label for="chartExSelect">🎯 Esercizio:</label>
                <select id="chartExSelect"></select>
                <label for="chartMetricSelect">📊 Metrica:</label>
                <select id="chartMetricSelect">
                    <option value="weight">Carico Massimo (kg)</option>
                    <option value="volume">Volume Totale (kg × reps)</option>
                </select>
            </div>
        </div>
        <div class="log-card">
            <canvas id="progressChart" style="width:100%; max-height:380px;"></canvas>
        </div>
    </div>

    <script>
        // Registrazione Service Worker per installazione PWA offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const defaultData = {
                activePeriod: "Periodo 1 - Base",
                activeDayId: "giorno1",
                periods: {
                    "Periodo 1 - Base": {
                        days: [{ id: "giorno1", name: "Giorno 1 - Leg Day / Spinta" }],
                        exercises: {
                            "giorno1": [{ name: "Hip Thrust", sets: "4", reps: "8", weight: "50 kg", rest: "90s", notes: "Progressione +2.5kg a W" }]
                        }
                    }
                },
                history: [
                    { id: 1, date: "2026-03-01", period: "Periodo 1 - Base", dayName: "Giorno 1", exercises: [{ name: "Hip Thrust", sets: "4", reps: "8", weight: "50 kg" }], notes: "Buon inizio" },
                    { id: 2, date: "2026-03-10", period: "Periodo 1 - Base", dayName: "Giorno 1", exercises: [{ name: "Hip Thrust", sets: "4", reps: "8", weight: "55 kg" }], notes: "Aumentato peso" }
                ]
            };

            let appData;
            try {
                const stored = localStorage.getItem('workoutPwaData');
                appData = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(defaultData));
            } catch(e) { appData = JSON.parse(JSON.stringify(defaultData)); }

            function saveData() { localStorage.setItem('workoutPwaData', JSON.stringify(appData)); }

            const viewSchedaBtn = document.getElementById('viewSchedaBtn');
            const viewStoricoBtn = document.getElementById('viewStoricoBtn');
            const viewGraficiBtn = document.getElementById('viewGraficiBtn');
            const sectionScheda = document.getElementById('sectionScheda');
            const sectionStorico = document.getElementById('sectionStorico');
            const sectionGrafici = document.getElementById('sectionGrafici');

            function clearViews() {
                [viewSchedaBtn, viewStoricoBtn, viewGraficiBtn].forEach(b => b.classList.remove('active'));
                [sectionScheda, sectionStorico, sectionGrafici].forEach(s => s.style.display = 'none');
            }

            viewSchedaBtn.addEventListener('click', () => { clearViews(); viewSchedaBtn.classList.add('active'); sectionScheda.style.display = 'block'; });
            viewStoricoBtn.addEventListener('click', () => { clearViews(); viewStoricoBtn.classList.add('active'); sectionStorico.style.display = 'block'; renderHistory(); });
            viewGraficiBtn.addEventListener('click', () => { clearViews(); viewGraficiBtn.classList.add('active'); sectionGrafici.style.display = 'block'; setupChartSection(); });

            function renderPeriodSelector() {
                const select = document.getElementById('periodSelect');
                select.innerHTML = '';
                Object.keys(appData.periods).forEach(pName => {
                    const opt = document.createElement('option');
                    opt.value = pName; opt.textContent = pName;
                    if (pName === appData.activePeriod) opt.selected = true;
                    select.appendChild(opt);
                });
            }

            document.getElementById('periodSelect').addEventListener('change', (e) => {
                appData.activePeriod = e.target.value;
                appData.activeDayId = appData.periods[appData.activePeriod].days[0]?.id || null;
                saveData(); renderDaysTabs(); renderCurrentDayContent();
            });

            document.getElementById('addPeriodBtn').addEventListener('click', () => {
                const name = prompt("Nome nuovo ciclo/periodo:");
                if (name && name.trim()) {
                    const id = 'g_' + Date.now();
                    appData.periods[name.trim()] = { days: [{ id: id, name: "Giorno 1" }], exercises: { [id]: [] } };
                    appData.activePeriod = name.trim(); appData.activeDayId = id;
                    saveData(); renderPeriodSelector(); renderDaysTabs(); renderCurrentDayContent();
                }
            });

            document.getElementById('delPeriodBtn').addEventListener('click', () => {
                if (Object.keys(appData.periods).length <= 1) return alert("Devi mantenere almeno un periodo!");
                if (confirm(`Eliminare "${appData.activePeriod}"?`)) {
                    delete appData.periods[appData.activePeriod];
                    appData.activePeriod = Object.keys(appData.periods)[0];
                    appData.activeDayId = appData.periods[appData.activePeriod].days[0].id;
                    saveData(); renderPeriodSelector(); renderDaysTabs(); renderCurrentDayContent();
                }
            });

            document.getElementById('resetDataBtn').addEventListener('click', () => {
                if (confirm("Reset completo dati?")) { appData = JSON.parse(JSON.stringify(defaultData)); saveData(); location.reload(); }
            });

            function renderDaysTabs() {
                const container = document.getElementById('daysTabsContainer');
                container.innerHTML = '';
                const period = appData.periods[appData.activePeriod];
                if (!period) return;
                period.days.forEach(day => {
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (day.id === appData.activeDayId ? ' active' : '');
                    btn.textContent = day.name;
                    btn.addEventListener('click', () => { appData.activeDayId = day.id; saveData(); renderDaysTabs(); renderCurrentDayContent(); });
                    container.appendChild(btn);
                });
                const addBtn = document.createElement('button');
                addBtn.className = 'btn btn-purple'; addBtn.textContent = '➕ Giorno';
                addBtn.addEventListener('click', () => {
                    const name = prompt("Nome giorno:");
                    if (name && name.trim()) {
                        const id = 'g_' + Date.now();
                        period.days.push({ id: id, name: name.trim() });
                        period.exercises[id] = []; appData.activeDayId = id;
                        saveData(); renderDaysTabs(); renderCurrentDayContent();
                    }
                });
                container.appendChild(addBtn);
            }

            function renderCurrentDayContent() {
                const area = document.getElementById('dayContentArea');
                area.innerHTML = '';
                const period = appData.periods[appData.activePeriod];
                const dayObj = period?.days.find(d => d.id === appData.activeDayId);
                if (!dayObj) return;
                const exercises = period.exercises[dayObj.id] || [];

                area.innerHTML = `
                    <div class="action-bar">
                        <h3>${dayObj.name}</h3>
                        <button class="btn btn-green" id="addExBtn">➕ Esercizio</button>
                    </div>
                    <div class="table-container">
                        <table class="workout-table">
                            <thead><tr><th>Nome</th><th>Serie</th><th>Reps</th><th>Kg</th><th>Note</th><th></th></tr></thead>
                            <tbody id="exTbody"></tbody>
                        </table>
                    </div>
                `;

                document.getElementById('addExBtn').addEventListener('click', () => {
                    exercises.push({ name: "Nuovo Esercizio", sets: "3", reps: "10", weight: "0 kg", rest: "60s", notes: "" });
                    saveData(); renderCurrentDayContent();
                });

                const tbody = document.getElementById('exTbody');
                exercises.forEach((ex, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="text" value="${ex.name}" data-f="name"></td>
                        <td><input type="text" value="${ex.sets}" data-f="sets"></td>
                        <td><input type="text" value="${ex.reps}" data-f="reps"></td>
                        <td><input type="text" value="${ex.weight}" data-f="weight"></td>
                        <td><input type="text" value="${ex.notes}" data-f="notes"></td>
                        <td><button class="btn btn-red btn-del">❌</button></td>
                    `;
                    tr.querySelectorAll('input').forEach(inp => {
                        inp.addEventListener('input', (e) => { exercises[idx][e.target.getAttribute('data-f')] = e.target.value; saveData(); });
                    });
                    tr.querySelector('.btn-del').addEventListener('click', () => { exercises.splice(idx, 1); saveData(); renderCurrentDayContent(); });
                    tbody.appendChild(tr);
                });
            }

            // Storico & Grafico
            const newLogBtn = document.getElementById('newLogBtn');
            const logFormCard = document.getElementById('logFormCard');
            const logPeriodSelect = document.getElementById('logPeriodSelect');
            const logDaySelect = document.getElementById('logDaySelect');
            document.getElementById('logDate').value = new Date().toISOString().split('T')[0];

            newLogBtn.addEventListener('click', () => { logFormCard.style.display = 'block'; populateLogPeriodSelect(); });
            document.getElementById('cancelLogBtn').addEventListener('click', () => { logFormCard.style.display = 'none'; });

            function populateLogPeriodSelect() {
                logPeriodSelect.innerHTML = '';
                Object.keys(appData.periods).forEach(p => {
                    const opt = document.createElement('option'); opt.value = p; opt.textContent = p;
                    logPeriodSelect.appendChild(opt);
                });
                populateLogDaySelect();
            }
            logPeriodSelect.addEventListener('change', populateLogDaySelect);

            function populateLogDaySelect() {
                logDaySelect.innerHTML = '';
                const period = appData.periods[logPeriodSelect.value];
                period?.days.forEach(d => {
                    const opt = document.createElement('option'); opt.value = d.id; opt.textContent = d.name;
                    logDaySelect.appendChild(opt);
                });
                populateLogExercises();
            }
            logDaySelect.addEventListener('change', populateLogExercises);

            function populateLogExercises() {
                const cont = document.getElementById('logExercisesContainer');
                cont.innerHTML = '';
                const exList = appData.periods[logPeriodSelect.value]?.exercises[logDaySelect.value] || [];
                exList.forEach(ex => {
                    const div = document.createElement('div');
                    div.style.cssText = 'display:flex; gap:6px; margin-bottom:6px; align-items:center;';
                    div.innerHTML = `<span style="flex:2; font-size:0.85rem;"><strong>${ex.name}</strong></span>
                        <input type="text" class="l-sets" value="${ex.sets}" style="flex:1;">
                        <input type="text" class="l-reps" value="${ex.reps}" style="flex:1;">
                        <input type="text" class="l-weight" value="${ex.weight}" style="flex:1.5;">`;
                    cont.appendChild(div);
                });
            }

            document.getElementById('saveLogBtn').addEventListener('click', () => {
                const date = document.getElementById('logDate').value;
                const pName = logPeriodSelect.value;
                const dayObj = appData.periods[pName]?.days.find(d => d.id === logDaySelect.value);
                const rows = document.querySelectorAll('#logExercisesContainer > div');
                const loggedEx = [];
                rows.forEach(r => {
                    loggedEx.push({
                        name: r.querySelector('strong').innerText,
                        sets: r.querySelector('.l-sets').value,
                        reps: r.querySelector('.l-reps').value,
                        weight: r.querySelector('.l-weight').value
                    });
                });

                appData.history.unshift({ id: Date.now(), date, period: pName, dayName: dayObj?.name || "Workout", exercises: loggedEx, notes: document.getElementById('logNotes').value });
                saveData(); logFormCard.style.display = 'none'; renderHistory();
            });

            function renderHistory() {
                const list = document.getElementById('historyList'); list.innerHTML = '';
                if (!appData.history.length) return list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Nessun allenamento registrato.</p>';
                appData.history.forEach((h, idx) => {
                    const card = document.createElement('div'); card.className = 'log-card';
                    let items = h.exercises.map(e => `<li>📌 <strong>${e.name}</strong>: ${e.sets}x${e.reps} @ <span style="color:var(--accent-blue)">${e.weight}</span></li>`).join('');
                    card.innerHTML = `
                        <div class="log-header">
                            <div><div class="log-title">${h.dayName} <small style="color:var(--accent-purple)">(${h.period})</small></div><div class="log-date">📅 ${h.date}</div></div>
                            <button class="btn btn-red btn-del-log">🗑️</button>
                        </div>
                        <ul style="list-style:none; font-size:0.85rem;">${items}</ul>
                        ${h.notes ? `<div style="margin-top:8px; font-size:0.8rem; color:var(--text-muted); background:#0b0f19; padding:6px;">💬 ${h.notes}</div>` : ''}
                    `;
                    card.querySelector('.btn-del-log').addEventListener('click', () => { appData.history.splice(idx, 1); saveData(); renderHistory(); });
                    list.appendChild(card);
                });
            }

            let chartInstance = null;
            function setupChartSection() {
                const select = document.getElementById('chartExSelect'); select.innerHTML = '';
                const set = new Set();
                appData.history.forEach(h => h.exercises.forEach(e => set.add(e.name)));
                set.forEach(ex => { const opt = document.createElement('option'); opt.value = ex; opt.textContent = ex; select.appendChild(opt); });
                select.onchange = renderChart;
                document.getElementById('chartMetricSelect').onchange = renderChart;
                renderChart();
            }

            function renderChart() {
                const exName = document.getElementById('chartExSelect').value;
                const metric = document.getElementById('chartMetricSelect').value;
                if (!exName) return;
                const sorted = [...appData.history].sort((a,b) => new Date(a.date) - new Date(b.date));
                const labels = []; const data = [];

                sorted.forEach(h => {
                    const found = h.exercises.find(e => e.name === exName);
                    if (found) {
                        const w = parseFloat(found.weight.match(/\d+(\.\d+)?/)?.[0] || 0);
                        const s = parseFloat(found.sets) || 1;
                        const r = parseFloat(found.reps) || 1;
                        labels.push(`${h.date} (${h.period})`);
                        data.push(metric === 'weight' ? w : w * s * r);
                    }
                });

                const ctx = document.getElementById('progressChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: metric === 'weight' ? 'Carico (kg)' : 'Volume (kg)',
                            data,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.15)',
                            fill: true, tension: 0.25, pointRadius: 5
                        }]
                    },
                    options: { responsive: true, scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } } }
                });
            }

            renderPeriodSelector(); renderDaysTabs(); renderCurrentDayContent();
        });
    </script>
</body>
</html>
